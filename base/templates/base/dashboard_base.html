<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" media="screen" href="{% static 'css/vendor/bootstrap.css' %}">
    <link rel="stylesheet" type="text/css" media="screen" href="{% static 'css/vendor/stylesheet.css' %}">
    <script src="{% static 'js/vendor/jquery.min.js' %}"></script>
    <title>{% block title %} Studieren Institut | Dashboard {% endblock %}</title>
</head>

<body class="main-body">
    <button class="mobile-sidebar-toggle" id="sidebarToggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>

    <div id="dashboardbase">
        <aside class="fixed-sidebar" id="sidebar">
            <div class="brand">
                <a href="{% url 'dashboard' %}">Studieren</a>
            </div>
            <ul class="nav flex-column">
                {% block sidebar_menu %}{% endblock %}
            </ul>
        </aside>
        <main class="main-wrapper">
            {% block dashboard_content %}{% endblock %}
        </main>
    </div>

    <script>
        // Toggle sidebar on mobile
        const toggleBtn = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('mobile-open');
                document.body.classList.toggle('sidebar-open');
            });
            // بستن با کلیک بیرون (اختیاری)
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 768 && sidebar.classList.contains('mobile-open') &&
                    !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                    sidebar.classList.remove('mobile-open');
                    document.body.classList.remove('sidebar-open');
                }
            });
        }
    </script>
    <script id="themejs" src="{% static 'js/script.js' %}" data-ajax="" defer></script>
    <script src="{% static 'js/vendor/bootstrap.js' %}"></script>
    {% block extra_js %}{% endblock %}

</body>

</html>
