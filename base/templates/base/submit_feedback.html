{% extends 'base/dashboard_base.html' %}
{% block title %}Submit Feedback | Studieren{% endblock %}
{% block dashboard_content %}
<div class="feedback-form-section">
    <h2>Feedback for {{ class.title }}</h2>
    <p class="text-muted">Please rate your experience with this course.</p>
    <form method="POST">
        {% csrf_token %}
        <p>1 = Poor, 5 = Excellent</p>
        <div class="mb-3">
            <label>Teaching Quality</label>
            <select name="teaching_quality" class="form-select" required>
                <option value="">Select</option>
                {% for i in "12345" %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Communication</label>
            <select name="communication" class="form-select" required>
                <option value="">Select</option>
                {% for i in "12345" %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Punctuality</label>
            <select name="punctuality" class="form-select" required>
                <option value="">Select</option>
                {% for i in "12345" %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Engagement & Interaction</label>
            <select name="engagement" class="form-select" required>
                <option value="">Select</option>
                {% for i in "12345" %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Overall Satisfaction</label>
            <select name="overall_satisfaction" class="form-select" required>
                <option value="">Select</option>
                {% for i in "12345" %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Comments (optional)</label>
            <textarea name="comments" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
</div>
{% endblock %}
