{% extends 'base/dashboard_base.html' %}

{% block title %}Pay Placement Test | Studieren{% endblock %}
{% block dashboard_content %}
<div class="text-center py-5">
    <h2>Payment for Placement Test</h2>
    <p>Amount: <strong>{{ test_fee }} T</strong></p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-success btn-lg">Pay Now (Simulated)</button>
    </form>
    <a href="{% url 'student_placement_status' %}" class="btn btn-outline-secondary mt-2">Cancel</a>
</div>
{% endblock %}
